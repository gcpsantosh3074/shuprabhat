<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1747"/>
      <stop offset=".55" stop-color="#7a3f86"/>
      <stop offset="1" stop-color="#ff9a5c"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#ff8f3d"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset=".65" stop-color="#ffe28a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </radialGradient>
    <clipPath id="dial"><circle cx="256" cy="276" r="112"/></clipPath>
  </defs>

  <!-- background (full bleed, maskable-safe) -->
  <rect width="512" height="512" fill="url(#sky)"/>

  <!-- stopwatch crown -->
  <rect x="236" y="84" width="40" height="22" rx="6" fill="#ffe28a"/>
  <rect x="248" y="104" width="16" height="22" fill="#ffe28a"/>

  <!-- dial face -->
  <circle cx="256" cy="276" r="140" fill="#1e1747" fill-opacity=".55"/>
  <!-- track -->
  <circle cx="256" cy="276" r="140" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="18"/>
  <!-- progress arc (~70%) starting at 12 o'clock -->
  <circle cx="256" cy="276" r="140" fill="none" stroke="url(#arc)" stroke-width="18"
          stroke-linecap="round" stroke-dasharray="616 880" transform="rotate(-90 256 276)"/>

  <!-- rising sun inside the dial -->
  <g clip-path="url(#dial)">
    <g stroke="#ffe28a" stroke-width="7" stroke-linecap="round" stroke-opacity=".9">
      <line x1="256" y1="196" x2="256" y2="178"/>
      <line x1="200" y1="218" x2="188" y2="205"/>
      <line x1="312" y1="218" x2="324" y2="205"/>
      <line x1="170" y1="262" x2="152" y2="258"/>
      <line x1="342" y1="262" x2="360" y2="258"/>
    </g>
    <circle cx="256" cy="302" r="58" fill="url(#sun)"/>
    <rect x="130" y="302" width="252" height="100" fill="#2f2350"/>
    <path d="M130 314 C190 296 230 322 280 312 C320 304 350 300 382 310 L382 400 L130 400Z" fill="#4f3b70"/>
  </g>
</svg>
